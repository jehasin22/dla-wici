<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasza historia, Wicia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap">
<style>
/* Layout: a love letter on blush paper; one red thread runs down the page, each memory is a note pinned to it */
:root {
  --paper: #fbeef0;
  --paper-2: #f6dfe4;
  --note: #fffafb;
  --ink: #4a2233;
  --ink-soft: #8a5a6c;
  --thread: #d6455f;
  --rose: #ef8fa3;
  --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --font-body: "Quicksand", "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(circle at 20% 0%, var(--paper-2), transparent 60%), var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  overflow-x: hidden;
}
.wrap { max-width: 760px; margin: 0 auto; }

header { text-align: center; padding-block: 56px 28px; position: relative; }
.eyebrow { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
h1 {
  font-family: var(--font-hand); font-weight: 700;
  font-size: clamp(56px, 13vw, 96px); line-height: .95;
  margin: 10px 0 6px; color: var(--thread); text-wrap: balance;
}
.sub { font-size: 17px; color: var(--ink-soft); max-width: 34ch; margin: 0 auto; }
.big-heart { display: inline-block; font-size: 30px; color: var(--thread); animation: beat 1.6s ease-in-out infinite; margin-top: 14px; }
@keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.25)} 30%{transform:scale(1)} 45%{transform:scale(1.15)} }
.hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

.timeline { position: relative; padding: 12px 0 8px; }
.timeline::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 22px; width: 3px;
  background: repeating-linear-gradient(to bottom, var(--thread) 0 10px, transparent 10px 16px);
  border-radius: 2px; opacity: .7;
}
.month {
  position: relative; margin: 34px 0 14px 0; padding-left: 56px;
  font-family: var(--font-hand); font-size: 32px; font-weight: 700; color: var(--thread);
}
.month::before {
  content: ""; position: absolute; left: 14px; top: 50%; width: 19px; height: 19px;
  transform: translateY(-50%); background: var(--paper); border: 3px solid var(--thread); border-radius: 50%;
}
.month .yr { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-left: 6px; letter-spacing: .05em; }

.item { position: relative; padding-left: 56px; margin-bottom: 16px; }
.pin {
  position: absolute; left: 11px; top: 18px; width: 26px; height: 26px;
  display: grid; place-items: center; font-size: 15px; color: var(--thread);
}
.pin svg { width: 22px; height: 22px; fill: var(--thread); }
.card {
  background: var(--note); border-radius: 14px; padding: 14px 18px 16px;
  box-shadow: 0 1px 0 rgba(74,34,51,.05), 0 8px 22px -14px rgba(214,69,95,.45);
  transform: rotate(var(--tilt, 0deg));
  transition: transform .25s ease, box-shadow .25s ease;
  cursor: pointer; min-width: 0;
}
.card:hover, .card:focus-visible { transform: rotate(0deg) translateY(-2px); box-shadow: 0 1px 0 rgba(74,34,51,.05), 0 14px 28px -14px rgba(214,69,95,.6); outline: none; }
.card:focus-visible { box-shadow: 0 0 0 3px var(--rose); }
.date { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--ink-soft); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.text { font-family: var(--font-hand); font-size: 25px; line-height: 1.2; margin-top: 2px; color: var(--ink); }
.text .em { font-size: 22px; margin-left: 4px; }
.card + .card { margin-top: 10px; }

.photo {
  display: block; width: 100%; padding: 0; border: 0; background: var(--paper-2);
  border-radius: 8px; overflow: hidden; margin-bottom: 12px; cursor: zoom-in;
  box-shadow: 0 0 0 5px #fff, 0 2px 10px rgba(74,34,51,.15);
}
.photo img, .photo video { display: block; width: 100%; max-width: 100%; max-height: 460px; object-fit: cover; object-position: center 35%; }
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s ease; }
.reveal-inner { overflow: hidden; min-height: 0; }
.open-card .reveal { grid-template-rows: 1fr; }
.open-card .reveal-inner { padding: 14px 6px 4px; }
.reveal .photo { margin-bottom: 0; }
.open {
  margin-top: 12px; font: 600 14px var(--font-body); color: var(--thread);
  background: #fff; border: 1.5px solid var(--rose); border-radius: 999px;
  padding: 8px 16px; cursor: pointer; transition: transform .35s cubic-bezier(.3,1.6,.5,1), background .2s;
  position: relative; z-index: 2;
}
.open:hover { background: #ffe8ee; }
.open:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
.open.shake { animation: wiggle .4s ease; }
@keyframes wiggle { 0%,100%{filter:none} 30%{filter:drop-shadow(0 0 6px var(--rose))} }
.sassy { margin: 12px 0 0; font-family: var(--font-hand); font-size: 23px; color: var(--thread); line-height: 1.2; }
.photos { display: grid; gap: 12px; margin-bottom: 12px; }
.photos.n2 { grid-template-columns: 1fr 1fr; }
.photos .photo { margin-bottom: 0; }
.photos.n2 .photo img { aspect-ratio: 3 / 4; height: auto; }
.photo:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }
.box {
  position: fixed; inset: 0; z-index: 100; background: rgba(40,14,26,.88);
  display: grid; place-items: center; cursor: zoom-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.box[hidden] { display: none; }
.box img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }

.special .card { background: linear-gradient(135deg, #fff 0%, #ffe8ee 100%); border: 1.5px dashed var(--rose); }

footer { text-align: center; padding-top: 40px; }
.counter-label { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.counter {
  font-family: var(--font-hand); font-weight: 700; color: var(--thread);
  font-size: clamp(64px, 18vw, 110px); line-height: 1; font-variant-numeric: tabular-nums;
}
.counter-unit { font-family: var(--font-hand); font-size: 30px; color: var(--ink); margin-top: -4px; }
.finale { font-family: var(--font-hand); font-size: clamp(34px, 8vw, 46px); line-height: 1.15; margin: 30px auto 6px; max-width: 18ch; text-wrap: balance; }
.sign { font-family: var(--font-hand); font-size: 26px; color: var(--ink-soft); }
.btn {
  margin-top: 22px; font: 600 15px var(--font-body); color: #fff; background: var(--thread);
  border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
  box-shadow: 0 10px 22px -10px rgba(214,69,95,.8); transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px) scale(1.03); }
.btn:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

.burst { position: fixed; pointer-events: none; font-size: 20px; color: var(--thread); z-index: 50; animation: fly 1.1s ease-out forwards; }
@keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }

.float { position: fixed; bottom: -30px; pointer-events: none; color: var(--rose); opacity: .5; z-index: 0; animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
.wrap { position: relative; z-index: 1; }

@media (min-width: 720px) {
  .timeline::before { left: 50%; margin-left: -1.5px; }
  .month { padding-left: 0; text-align: center; }
  .month::before { left: 50%; top: -18px; transform: translateX(-50%); }
  .item { padding-left: 0; width: 50%; }
  .item:nth-of-type(odd) { padding-right: 34px; }
  .item:nth-of-type(even) { margin-left: 50%; padding-left: 34px; }
  .item:nth-of-type(odd) .pin { left: auto; right: -13px; }
  .item:nth-of-type(even) .pin { left: -13px; }
}
@media (prefers-reduced-motion: reduce) {
  .big-heart, .float, .burst { animation: none !important; }
  .float, .burst { display: none; }
  .card { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Od 17 września 2025</div>
    <h1>Nasza historia</h1>
    <p class="sub">Dla mojej Wici. Wszystkie małe i duże chwile, które są tylko nasze.</p>
    <div class="big-heart" aria-hidden="true">♥</div>
    <div class="hint">Klikaj w przyciski, żeby odkryć nasze zdjęcia</div>
  </header>

  <main class="timeline" id="timeline"></main>

  <footer>
    <div class="counter-label">Jesteśmy razem już</div>
    <div class="counter" id="days">0</div>
    <div class="counter-unit" id="days-unit">dni</div>
    <p class="finale">A to dopiero początek. Kocham Cię, Wiciu.</p>
    <div class="sign">Twój ♥</div>
    <button class="btn" id="love" type="button">Wyślij buziaka ♥</button>
  </footer>
</div>

<div class="box" id="box" hidden><img id="box-img" alt=""></div>

<script>
const months = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
const monthsGen = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];

// [rok, miesiąc(1-12), dzień, tekst, emoji, wyjątkowe?, zdjęcie]
const memories = [
  [2025, 9, 17, "Pierwszy raz się spotkaliśmy i przesiedzieliśmy razem cały dzień w hotelu", "✨", true, "0917"],
  [2025, 9, 30, "Przyjechałem po Ciebie do Krakowa i zabrałem Cię do Wrocławia, bo bałaś się sama jeździć pociągami", "🚆", false, "0930"],
  [2025, 12, 8, "Pierwszy raz zostałaś u mnie na noc", "🌙", false, "1208"],
  [2025, 12, 19, "Nasz pierwszy raz", "❤️", true, "1219"],
  [2026, 2, 26, "Nie wytrzymałem i dałem Ci prezent na Dzień Kobiet dwa tygodnie przed czasem", "🎁", false, "0226"],
  [2026, 2, 27, "Pierwszy późny spacer po Wrocławiu, zaraz po kinie", "🎬", false, "0227"],
  [2026, 3, 2, "Pierwszy raz poszliśmy razem na siłownię", "💪", false, "0302"],
  [2026, 3, 7, "Nosiłem Twoją torebkę", "👜", false, "0307a"],
  [2026, 3, 7, "Kwiatki dla Ciebie na Dzień Kobiet", "💐", false, "0307b"],
  [2026, 3, 19, "Spałaś mi na kolanach w pociągu", "😴", false, "0319"],
  [2026, 3, 25, "Bujaliśmy się na huśtawce i było cudownie", "🎠", false, "0325", true],
  [2026, 5, 8, "Romantyczny spacer z pieskiem", "🐶", false, "0508"],
  [2026, 5, 23, "Leżeliśmy razem na trawce", "🌿", false, "0523"],
  [2026, 6, 12, "Kwiatki na Twoje urodziny", "🌷", true, "0612"],
  [2026, 7, 5, "Pierwszy raz poznałem całą Twoją rodzinę na Twoich urodzinach", "👨‍👩‍👧", false, "0705"],
  [2026, 8, 8, "Znowu razem po trzech tygodniach rozłąki", "🤍", true, "0808"],
  [2026, 8, 15, "Wicia pierwszy raz się poddała i przestała się ze mną kłócić", "🏳️", false, "0815"],
  [2026, 8, 22, "Moje urodziny z moją ukochaną dziewczyną", "🎂", false, "0822"],
  [2026, 8, 24, "Wycieczka z moim bratem", "🚗", false, "0824"],
  [2026, 9, 4, "Kolejny nocny spacer z energetykami o 3 w nocy", "⚡", false, "0904"],
  [2026, 9, 10, "Wielki dzień kebaba Wici", "🥙", false, "0910"],
  [2026, 9, 20, "Kolejne urodziny z całą Twoją rodziną", "🎉", false, "0920"],
  [2026, 10, 8, "Wicia gamerka", "🎮", false, "1008"],
];

const heartSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
const tl = document.getElementById("timeline");
let lastKey = "", currentItem = null, lastDate = "", idx = 0, memNo = 0;

// Odkrywanie zdjęć; pierwszy przycisk jest wredny
const dodges = ["Nie", "Nie chce mi się", "Nieee 😤"];
function handleOpen(card, btn) {
  if (btn.dataset.naughty) {
    const step = Number(btn.dataset.step || 0);
    if (step < dodges.length) {
      btn.dataset.step = step + 1;
      btn.textContent = dodges[step];
      const room = Math.max(0, card.clientWidth - btn.offsetWidth - 40);
      const x = (step % 2 ? -1 : 1) * (room * (0.4 + Math.random() * 0.5));
      const y = -8 - Math.random() * 18;
      btn.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (step % 2 ? -6 : 6) + "deg)";
      btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
      return;
    }
    card.querySelector(".sassy").hidden = false;
  }
  btn.hidden = true;
  card.classList.add("open-card");
  const v = card.querySelector("video");
  if (v) { v.play().catch(() => {}); }
  const r = card.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + 40, 12);
}

memories.forEach(([y, m, d, text, emoji, special, photo, isVideo]) => {
  const key = y + "-" + m;
  if (key !== lastKey) {
    const h = document.createElement("h2");
    h.className = "month";
    h.innerHTML = months[m-1] + '<span class="yr">' + y + "</span>";
    tl.appendChild(h);
    lastKey = key;
  }
  const dateKey = y + "-" + m + "-" + d;
  if (dateKey !== lastDate || !currentItem) {
    currentItem = document.createElement("section");
    currentItem.className = "item" + (special ? " special" : "");
    currentItem.innerHTML = '<span class="pin">' + heartSvg + "</span>";
    tl.appendChild(currentItem);
    lastDate = dateKey;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.tabIndex = 0;
  card.style.setProperty("--tilt", ((idx++ % 3) - 1) * 0.8 + "deg");
  let media = "";
  if (photo && isVideo) {
    media = '<div class="photo"><video src="photos/' + photo + '.mp4" poster="photos/' + photo + '.jpg" autoplay muted loop playsinline preload="metadata"></video></div>';
  } else if (photo) {
    const list = Array.isArray(photo) ? photo : [photo];
    media = '<div class="photos n' + list.length + '">' + list.map(p => '<button class="photo" type="button" data-src="photos/' + p + '.jpg" aria-label="Powiększ zdjęcie"><img src="photos/' + p + '.jpg" alt="' + text + '" loading="lazy"></button>').join("") + "</div>";
  }
  const n = memNo++;
  const words = '<div class="date">' + d + " " + monthsGen[m-1] + " " + y + '</div><div class="text">' + text + '<span class="em" aria-hidden="true">' + emoji + "</span></div>";
  if (photo && n > 0) {
    const label = isVideo ? "Zobacz filmik ♥" : "Zobacz zdjęcie ♥";
    card.innerHTML = words +
      '<div class="reveal"><div class="reveal-inner">' + media + '</div></div>' +
      '<p class="sassy" hidden>Zobacz, ten przycisk jest tak samo wredny jak Ty czasami 😜</p>' +
      '<button class="open" type="button"' + (n === 1 ? ' data-naughty="1"' : "") + ">" + label + "</button>";
  } else {
    card.innerHTML = media + words;
  }
  const go = e => { const r = card.getBoundingClientRect(); burst(e.clientX || r.left + r.width/2, e.clientY || r.top + r.height/2, 10); };
  card.addEventListener("click", e => {
    const op = e.target.closest("button.open");
    if (op) { handleOpen(card, op); return; }
    const btn = e.target.closest("button.photo");
    if (btn) { openBox(btn.dataset.src, text); return; }
    go(e);
  });
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go({}); } });
  currentItem.appendChild(card);
});

// Powiększanie zdjęć
const box = document.getElementById("box"), boxImg = document.getElementById("box-img");
function openBox(src, alt) { boxImg.src = src; boxImg.alt = alt; box.hidden = false; }
box.addEventListener("click", () => { box.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") box.hidden = true; });

// Licznik dni
const start = new Date(2025, 8, 17);
const now = new Date();
const days = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / 86400000);
const daysEl = document.getElementById("days");
function plural(n) { if (n === 1) return "dzień"; return "dni"; }
document.getElementById("days-unit").textContent = plural(days) + " ♥";
daysEl.textContent = days;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let counted = false;
function countUp() {
  if (counted || reduce) return; counted = true;
  const t0 = performance.now(), dur = 1600;
  (function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    daysEl.textContent = Math.round(days * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
if ("IntersectionObserver" in window) {
  new IntersectionObserver((es, o) => { es.forEach(e => { if (e.isIntersecting) { countUp(); o.disconnect(); } }); }, { threshold: .6 }).observe(daysEl);
}

function burst(x, y, n) {
  if (reduce) return;
  const glyphs = ["♥","❤","💕","💗"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "burst";
    s.textContent = glyphs[i % glyphs.length];
    const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r - 40 + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}
document.getElementById("love").addEventListener("click", e => {
  burst(e.clientX, e.clientY, 24);
  e.currentTarget.textContent = "Buziak wysłany 😘";
});

// Unoszące się serduszka w tle
if (!reduce) {
  setInterval(() => {
    const h = document.createElement("span");
    h.className = "float";
    h.textContent = "♥";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 10 + Math.random() * 18 + "px";
    h.style.animationDuration = 9 + Math.random() * 8 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 18000);
  }, 1400);
}
</script>
</body>
</html>
